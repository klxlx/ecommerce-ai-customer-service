name: ecommerce-customer-service

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cs_user
      POSTGRES_PASSWORD: cs_password
      POSTGRES_DB: cs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d cs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cs_user:cs_password@db:5432/cs_db
      MOCK_PROVIDERS: "${MOCK_PROVIDERS:-1}"
      CHAT_API_KEY: "${CHAT_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      CHAT_MODEL: "${CHAT_MODEL:-qwen-plus}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-v4}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      SSE_HEARTBEAT_SECONDS: "${SSE_HEARTBEAT_SECONDS:-15}"
      SENTINEL_ENABLED: "${SENTINEL_ENABLED:-1}"
      SENTINEL_MODEL: "${SENTINEL_MODEL:-}"
      VISION_PROVIDER: "${VISION_PROVIDER:-yolo}"
      YOLO_MODEL_PATH: "${YOLO_MODEL_PATH:-models/yolov8n.onnx}"
      YOLO_CONFIDENCE_THRESHOLD: "${YOLO_CONFIDENCE_THRESHOLD:-0.35}"
      RETURN_IMAGE_DIR: "${RETURN_IMAGE_DIR:-data/return_images}"
      SEMANTIC_CACHE_ENABLED: "${SEMANTIC_CACHE_ENABLED:-1}"
      SEMANTIC_CACHE_SIMILARITY: "${SEMANTIC_CACHE_SIMILARITY:-0.95}"
      SEMANTIC_CACHE_EMBEDDING_MODEL: "${SEMANTIC_CACHE_EMBEDDING_MODEL:-}"
    volumes:
      - ./models:/app/models:ro
      - return_images:/app/data/return_images
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  return_images:
