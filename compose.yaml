name: ecommerce-customer-service

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cs_user
      POSTGRES_PASSWORD: cs_password
      POSTGRES_DB: cs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d cs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cs_user:cs_password@db:5432/cs_db
      MOCK_PROVIDERS: "${MOCK_PROVIDERS:-1}"
      CHAT_API_KEY: "${CHAT_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      CHAT_MODEL: "${CHAT_MODEL:-qwen-plus}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
